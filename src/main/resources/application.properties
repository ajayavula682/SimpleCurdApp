spring.application.name=SimpleCurdApp
server.port=8082

# ============================================================================
# DATABASE CONFIGURATION - Choose one based on your setup
# ============================================================================
#
# FOR LOCAL DEVELOPMENT (MySQL running on your machine):
# 1. Install MySQL: brew install mysql
# 2. Start MySQL: brew services start mysql
# 3. Create database: mysql -u root -e "CREATE DATABASE BankDb;"
# 4. Set password: mysql -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED BY 'Sree@1324';"
# 5. Uncomment the LOCAL configuration below
# 6. Run: mvn spring-boot:run
#
# FOR DOCKER (MySQL in container):
# 1. Use the Docker configuration below
# 2. Run: docker-compose up --build
# 3. Access at: http://localhost:8088
#
# ============================================================================

# --- LOCAL DEVELOPMENT CONFIGURATION (Uncomment to use locally) ---
spring.datasource.url=jdbc:mysql://localhost:3306/BankDb

# --- DOCKER CONFIGURATION (Use when running with docker-compose) ---
#spring.datasource.url=jdbc:mysql://mysql:3306/BankDb

# Database credentials
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Sree@1324

#spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Hibernate: 'update' - creates/updates tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ============================================================================
# ACTUATOR & MONITORING (Health checks, metrics, logs)
# ============================================================================
#spring actuator endpoints
management.endpoints.web.exposure.include=health,metrics,loggers,prometheus
management.endpoint.health.show-details=always

# ============================================================================
# REDIS CONFIGURATION - DISABLED (Redis caching removed from project)
# To re-enable Redis:
# 1. Uncomment the lines below
# 2. Uncomment the redis dependency in pom.xml
# 3. Uncomment RedisConfig.java in config/
# ============================================================================
#redis config - DISABLED
#spring.data.redis.host=host.docker.internal
#spring.data.redis.port=6379

# ============================================================================
# SWAGGER/OPENAPI DOCUMENTATION
# Access Swagger UI at: http://localhost:8082/swagger-ui.html
# ============================================================================
# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true





